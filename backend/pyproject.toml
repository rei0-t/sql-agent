[project]
name = "sql-agent-backend"
version = "0.1.0"
description = "SQL-agent backend: natural language to SQL, with separated read-only and mutation channels."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "aiosqlite>=0.20",
  "pyjwt>=2.9",
  "cryptography>=43",
  "aiomysql>=0.2.0",
  "asyncpg>=0.29",
  "sqlglot>=25.0",
  "pyyaml>=6.0",
  "alembic>=1.13",
  # 运行时就要用：app/engine/llm.py 直接 import httpx 调模型接口
  "httpx>=0.27",
  # 上传 SQLite 文件要用（FastAPI 的 multipart 解析器）
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入惯例就是在默认参数里调用 Depends()
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Security",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.File",
  "fastapi.Form",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
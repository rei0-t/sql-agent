[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# The real URL is injected by migrations/env.py from app.config.settings.
# This value is only a placeholder for tooling that requires the key.
sqlalchemy.url = sqlite+aiosqlite:///./data/sqlagent.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
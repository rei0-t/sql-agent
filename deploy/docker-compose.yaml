# 单机部署：一条命令起来，适合自托管与内网试用。
#
#   cp .env.example .env   # 先改 SQLAGENT_SECRET_KEY 和管理员口令
#   docker compose -f deploy/docker-compose.yaml up -d
#   open http://127.0.0.1:8080

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: sql-agent:dev
    restart: unless-stopped
    ports:
      - "${SQLAGENT_PORT:-8080}:8080"
    environment:
      SQLAGENT_DATABASE_URL: postgresql+asyncpg://sqlagent:sqlagent@db:5432/sqlagent
      SQLAGENT_SECRET_KEY: ${SQLAGENT_SECRET_KEY:-change-me-in-production}
      SQLAGENT_ADMIN_USERNAME: ${SQLAGENT_ADMIN_USERNAME:-admin}
      SQLAGENT_ADMIN_PASSWORD: ${SQLAGENT_ADMIN_PASSWORD:-sqlagent123}
      SQLAGENT_DATA_DIR: /app/backend/data
    volumes:
      - ./data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqlagent
      POSTGRES_PASSWORD: sqlagent
      POSTGRES_DB: sqlagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlagent -d sqlagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
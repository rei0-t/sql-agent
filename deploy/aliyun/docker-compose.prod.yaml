# 阿里云 ECS 生产部署：应用 + PostgreSQL（元数据库）
#
#   cp deploy/aliyun/.env.prod.example .env.prod   # 改 SECRET_KEY / 管理员口令 / 数据库口令
#   docker compose -f deploy/aliyun/docker-compose.prod.yaml --env-file .env.prod up -d --build
#
# 8080 只绑 127.0.0.1：外网一律走 Nginx（TLS 终止在 Nginx 上）。
# 语义层放在 deploy/aliyun/data/semantics.yaml，容器内直接读到。

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: sql-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SQLAGENT_DATABASE_URL: postgresql+asyncpg://sqlagent:${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}@db:5432/sqlagent
      SQLAGENT_SECRET_KEY: ${SQLAGENT_SECRET_KEY:?请设置 SQLAGENT_SECRET_KEY}
      SQLAGENT_ADMIN_USERNAME: ${SQLAGENT_ADMIN_USERNAME:-admin}
      SQLAGENT_ADMIN_PASSWORD: ${SQLAGENT_ADMIN_PASSWORD:?请设置 SQLAGENT_ADMIN_PASSWORD}
      SQLAGENT_DATA_DIR: /app/backend/data
      SQLAGENT_SEMANTICS_PATH: /app/backend/data/semantics.yaml
      SQLAGENT_LLM_TIMEOUT: ${SQLAGENT_LLM_TIMEOUT:-60}
      SQLAGENT_READ_MAX_ROWS: ${SQLAGENT_READ_MAX_ROWS:-200}
      SQLAGENT_QUERY_TIMEOUT: ${SQLAGENT_QUERY_TIMEOUT:-10}
      SQLAGENT_LLM_SEED: ${SQLAGENT_LLM_SEED:-42}
      # 模型 Key 建议在界面里配（加密入库）；这里留空即以界面配置为准
      SQLAGENT_LLM_BASE_URL: ${SQLAGENT_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      SQLAGENT_LLM_MODEL: ${SQLAGENT_LLM_MODEL:-qwen-plus}
      SQLAGENT_LLM_API_KEY: ${SQLAGENT_LLM_API_KEY:-}
    volumes:
      - ./data:/app/backend/data
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqlagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
      POSTGRES_DB: sqlagent
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlagent -d sqlagent"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
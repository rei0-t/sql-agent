# SQL-agent 的 Nginx 配置（阿里云 ECS + 自签/免费证书）
#
#   1) 把证书放到 /etc/nginx/certs/（阿里云「数字证书管理服务」可申请免费 DV 证书）
#   2) 替换下面的 server_name 与证书路径
#   3) nginx -t && systemctl reload nginx
#
# 关键点：SSE 必须关掉缓冲，否则前端要等全部生成完才一次性收到结果。

upstream sql_agent {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name sql-agent.example.com;

    # 只有确定要用 https 时才开下面这行，否则先留着方便调试
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://sql_agent;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sql-agent.example.com;

    ssl_certificate     /etc/nginx/certs/sql-agent.pem;
    ssl_certificate_key /etc/nginx/certs/sql-agent.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 4m;

    # ---- 健康检查不写日志 ----
    location = /api/v1/health {
        access_log off;
        proxy_pass http://sql_agent;
    }

    # ---- SSE 流式问答：单独一段，关缓冲、放长超时 ----
    location = /api/v1/chat/stream {
        proxy_pass http://sql_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
    }

    # ---- 其余请求：普通反代（一次问答可能 20s，读超时要够） ----
    location / {
        proxy_pass http://sql_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 静态资源长缓存（文件名带 hash）
    location /assets/ {
        proxy_pass http://sql_agent;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
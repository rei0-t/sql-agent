# SQL-agent：HTTP 版反代（没有域名时用公网 IP 直接访问）
#
#   sudo cp deploy/aliyun/nginx-http.conf /etc/nginx/conf.d/sql-agent.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 关键点：SSE 必须关掉代理缓冲，否则前端要等整段回答生成完才一次性收到。

upstream sql_agent {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    # 必须 ≥ 应用侧的单文件上限（SQLAGENT_UPLOAD_MAX_MB_PER_FILE，默认 50MB），
    # 否则大文件会在这里被 413 掉，用户看到的是 Nginx 的 HTML 而不是我们的错误提示
    client_max_body_size 64m;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Let's Encrypt 签发证书时的验证文件（deploy/aliyun/enable-https.sh 用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 健康检查不写日志
    location = /api/v1/health {
        access_log off;
        proxy_pass http://sql_agent;
    }

    # 流式问答：关缓冲、放长超时
    location = /api/v1/chat/stream {
        proxy_pass http://sql_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
    }

    # 静态资源：文件名带 hash，可以长缓存
    location /assets/ {
        proxy_pass http://sql_agent;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://sql_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 一次问答可能 20s，读超时要够
        proxy_read_timeout 120s;
    }
}
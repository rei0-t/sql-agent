# SQL-agent：HTTPS 版反代（有域名之后用这份替换 HTTP 配置）
#
#   1) 证书放到 /etc/nginx/certs/（阿里云「数字证书管理服务」有免费 DV 证书）
#   2) 把 sql-agent.example.com 换成你的域名，证书路径改成实际文件名
#   3) sudo nginx -t && sudo systemctl reload nginx
#   4) 回到 .env.prod 把 SQLAGENT_COOKIE_SECURE 改成 true，再重启容器
#
# 注意 http2 的写法：`listen 443 ssl http2;` 在 nginx 1.18–1.25 都能用；
# 新版推荐拆成 `listen 443 ssl;` + `http2 on;`，但老版本会直接语法错误。

upstream sql_agent {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name sql-agent.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sql-agent.example.com;

    ssl_certificate     /etc/nginx/certs/sql-agent.pem;
    ssl_certificate_key /etc/nginx/certs/sql-agent.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 4m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 只在 HTTPS 下加 HSTS；先用 IP 验证阶段不要开
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /api/v1/health {
        access_log off;
        proxy_pass http://sql_agent;
    }

    location = /api/v1/chat/stream {
        proxy_pass http://sql_agent;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding off;
    }

    location /assets/ {
        proxy_pass http://sql_agent;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://sql_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}